<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainGain EU — Homepage Concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style>
html, body { height: 100%; }
body { margin: 0; background: #2A2E31; display: flex; align-items: center;
       justify-content: center; font-family: 'Archivo','Helvetica Neue',Arial,sans-serif; }
.frame { box-shadow: 0 24px 70px rgba(0,0,0,.5); border-radius: 12px; overflow: hidden; }

    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; }
    a { color: #2CC2E3; text-decoration: none; }
    a:hover { color: #7BDCEF; }

    /* Adjustable-dumbbell demo: lift 2 plates, set down, twist, lift 3 plates.
       6.6s loop. Both lifts identical: rise 0.6s, hold 0.9s, lower 0.5s,
       settle 0.2s, twist 0.6s. 1s pause between cycles.
       Each element needs ONE animation declaration: a second shorthand
       would override the first. */
    .bg-plate-a { animation:
        bg-lift-a 6.6s cubic-bezier(.45,.05,.35,1) infinite,
        bg-tint-a 6.6s ease-in-out infinite; }
    .bg-plate-b { animation:
        bg-lift-b 6.6s cubic-bezier(.45,.05,.35,1) infinite,
        bg-tint-b 6.6s ease-in-out infinite; }
    .bg-lift-a  { animation: bg-lift-a 6.6s cubic-bezier(.45,.05,.35,1) infinite; }
    .bg-twist   { animation: bg-twist 6.6s cubic-bezier(.6,0,.3,1) infinite;
                  transform-box: fill-box; transform-origin: center; }

    @keyframes bg-lift-a {
      0%                  { transform: translateY(0); }
      9.091%, 22.727%     { transform: translateY(-26px); }
      30.303%, 42.424%    { transform: translateY(0); }
      51.515%, 65.152%    { transform: translateY(-26px); }
      72.727%, 100%       { transform: translateY(0); }
    }
    @keyframes bg-lift-b {
      0%, 42.424%         { transform: translateY(0); }
      51.515%, 65.152%    { transform: translateY(-26px); }
      72.727%, 100%       { transform: translateY(0); }
    }
    @keyframes bg-tint-a {
      0%                  { fill: #474D52; }
      9.091%, 22.727%     { fill: #2CC2E3; }
      30.303%, 42.424%    { fill: #474D52; }
      51.515%, 65.152%    { fill: #2CC2E3; }
      72.727%, 100%       { fill: #474D52; }
    }
    @keyframes bg-tint-b {
      0%, 42.424%         { fill: #474D52; }
      51.515%, 65.152%    { fill: #2CC2E3; }
      72.727%, 100%       { fill: #474D52; }
    }
    @keyframes bg-twist {
      0%, 33.333%         { transform: rotate(0deg); }
      42.424%, 75.758%    { transform: rotate(180deg); }
      84.848%, 100%       { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-lift-a, .bg-plate-a, .bg-plate-b, .bg-twist { animation: none; }
    }
  
</style>
</head>
<body>
<div class="frame">
<div style="width: 390px; height: 844px; background: #111111; color: #FFFFFF; display: flex; flex-direction: column; overflow: hidden;">

  <!-- HEADER -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px 20px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2CC2E3" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>
      </svg>
      <span style="font-size: 17px; font-weight: 800; letter-spacing: 0.06em;">BRAINGAIN</span>
    </div>
    <div style="display: flex; align-items: center; gap: 18px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
      </svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
        <path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>
      </svg>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </div>
  </div>

  <!-- HERO -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; position: relative;">

    <div style="position: absolute; top: 50%; left: 50%; width: 460px; height: 460px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(44,194,227,0.13) 0%, rgba(44,194,227,0) 68%); pointer-events: none;"></div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 26px;">

      <div style="display: flex; justify-content: center;">
        <svg width="234" height="140" viewBox="0 0 250 150" fill="none" role="img" aria-label="One handle picking up two plates, then twisting and picking up three.">

          <!-- cradle -->
          <rect x="18" y="128" width="214" height="5" rx="2.5" fill="#FFFFFF" opacity="0.13"/>

          <!-- outer plates: never picked up. Heights taper small-big-small per side. -->
          <rect x="28"  y="66" width="12" height="44" rx="2.5" fill="#33383C"/>
          <rect x="44"  y="58" width="12" height="60" rx="2.5" fill="#3B4145"/>
          <rect x="194" y="58" width="12" height="60" rx="2.5" fill="#3B4145"/>
          <rect x="210" y="66" width="12" height="44" rx="2.5" fill="#33383C"/>

          <!-- third plate each side (the tall one): joins on the second lift -->
          <rect class="bg-plate-b" x="60"  y="50" width="12" height="76" rx="2.5" fill="#474D52"/>
          <rect class="bg-plate-b" x="178" y="50" width="12" height="76" rx="2.5" fill="#474D52"/>

          <!-- two inner plates each side: lift both times -->
          <rect class="bg-plate-a" x="76"  y="58" width="12" height="60" rx="2.5" fill="#474D52"/>
          <rect class="bg-plate-a" x="92"  y="66" width="12" height="44" rx="2.5" fill="#474D52"/>
          <rect class="bg-plate-a" x="146" y="66" width="12" height="44" rx="2.5" fill="#474D52"/>
          <rect class="bg-plate-a" x="162" y="58" width="12" height="60" rx="2.5" fill="#474D52"/>

          <!-- handle: lifts, and twists between the two lifts -->
          <g class="bg-lift-a">
            <g class="bg-twist">
              <rect x="106" y="82" width="38" height="12" rx="6" fill="#E9EDEF"/>
              <rect x="112" y="85" width="4" height="6" rx="2" fill="#8E979C"/>
              <rect x="120" y="85" width="4" height="6" rx="2" fill="#8E979C"/>
              <rect x="128" y="85" width="4" height="6" rx="2" fill="#8E979C"/>
              <rect x="136" y="85" width="3" height="6" rx="1.5" fill="#2CC2E3"/>
            </g>
          </g>

        </svg>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <h1 style="margin: 0; font-size: 46px; line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; text-wrap: pretty;">Your gym.<br><span style="color: #2CC2E3;">Without the gym</span>.</h1>
        <p style="margin: 0; font-size: 16px; line-height: 1.45; font-weight: 400; color: rgba(255,255,255,0.66); text-wrap: pretty;">Strength that fits your life, not the other way round.</p>
      </div>

    </div>
  </div>

  <!-- CTA -->
  <div style="padding: 0 24px 22px 24px; display: flex; flex-direction: column; gap: 11px; flex-shrink: 0;">
    <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 9px; height: 54px; background: #2CC2E3; color: #111111; font-size: 16px; font-weight: 600; border-radius: 4px; letter-spacing: 0.01em;">
      Shop SmartBells
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </a>
  </div>

  <!-- TRUST SIGNALS -->
  <div style="border-top: 1px solid rgba(255,255,255,0.11); padding: 18px 24px 22px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px; flex-shrink: 0;">

    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2CC2E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="1.7"/><circle cx="17" cy="18" r="1.7"/>
      </svg>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 13px; font-weight: 600;">Free delivery</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.5);">Across the EU</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2CC2E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.5 5.5 6 .7-4.5 4.1 1.3 6-5.3-3-5.3 3 1.3-6L3.5 9.2l6-.7z"/>
      </svg>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 13px; font-weight: 600;">1,800+ reviews</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.5);">on Trustpilot</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2CC2E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6z"/><path d="M9 12l2 2 4-4"/>
      </svg>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 13px; font-weight: 600;">3-year warranty</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.5);">Elite cover</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2CC2E3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 8.5a3 3 0 0 1 0 5"/><path d="M18 19c0-2.4-.9-4.2-2.4-5.2"/>
      </svg>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 13px; font-weight: 600;">75,000+ lifters</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.5);">In 30+ countries</span>
      </div>
    </div>

  </div>

</div>
</div>
</body>
</html>
